<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="用自然语言记录产品背景、功能流程、业务规则和系统依赖。" />
    <title>产品蓝图</title>
    <script>
      (() => {
  let theme;
  try {
    theme = localStorage.getItem('product-workbench-theme');
  } catch {}
  if (theme !== 'light' && theme !== 'dark')
    theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
})();

    </script>
    <style>
      :root {
  --bg: #fff;
  --paper: #fff;
  --side: #fafafa;
  --ink: #171717;
  --muted: #737373;
  --line: #e5e5e5;
  --green: #171717;
  --green-soft: #f5f5f5;
  --orange: #737373;
  --theme-text: #171717;
  --theme-muted-text: #737373;
  --theme-paper: #fff;
  --theme-soft-surface: #f5f5f5;
  --theme-cool-surface: #fafafa;
  --theme-border: #d4d4d4;
  --theme-selected: #f0f0f0;
  --theme-selected-border: #737373;
  --theme-diagram-arrow: #737373;
  --theme-warning-text: #525252;
  --theme-primary-text: #fff;
  --seq-request: #333;
  --seq-return: #666;
  --seq-lifeline: #888;
  --seq-role-border: #ccc;
  color-scheme: light;
  font-family:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.65;
}
:root[data-theme='dark'] {
  --bg: #000;
  --paper: #0a0a0a;
  --side: #000;
  --ink: #ededed;
  --muted: #a3a3a3;
  --line: #262626;
  --green: #ededed;
  --green-soft: #171717;
  --theme-text: #ededed;
  --theme-muted-text: #a3a3a3;
  --theme-paper: #0a0a0a;
  --theme-soft-surface: #171717;
  --theme-cool-surface: #111;
  --theme-border: #404040;
  --theme-selected: #1a1a1a;
  --theme-selected-border: #a3a3a3;
  --theme-diagram-arrow: #a3a3a3;
  --theme-warning-text: #d4d4d4;
  --theme-primary-text: #000;
  --seq-request: #dedede;
  --seq-return: #b3b3b3;
  --seq-lifeline: #666;
  --seq-role-border: #555;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
}
h1,
h2,
h3,
p {
  margin: 0;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
  border-radius: 0;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button:focus-visible,
a:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 3px;
}
button svg {
  pointer-events: none;
}
svg {
  display: block;
}
.hidden,
[hidden] {
  display: none !important;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.small {
  font-size: 11px;
}
.muted {
  color: var(--muted);
}
.icon {
  flex-shrink: 0;
}
.app {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--side);
  border-right: 1px solid var(--line);
  min-width: 0;
}
.brand {
  display: grid;
  gap: 5px;
  padding: 0 10px 18px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand-name {
  font-size: 16px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.brand-subtitle {
  font-size: 11px;
  color: var(--muted);
}
.sidebar-top {
  display: grid;
  gap: 10px;
  flex-shrink: 0;
}
.overview-nav {
  padding: 8px 10px;
  text-align: left;
  font-size: 13px;
}
.overview-nav.active,
.overview-nav:hover {
  background: var(--theme-selected);
}
.view-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line);
  padding: 3px;
}
.view-tab {
  padding: 7px 3px;
  font-size: 12px;
  color: var(--muted);
}
.view-tab.active {
  background: var(--theme-selected);
  color: var(--ink);
}
.sidebar-directory {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-directory > nav {
  flex: 1;
  min-height: 0;
  overflow: auto;
  scrollbar-width: none;
}
.sidebar-directory > nav::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
.nav-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  flex-shrink: 0;
}
.nav-label {
  font-size: 10px;
  color: var(--muted);
  padding: 0 8px;
}
.tree-actions {
  display: flex;
  gap: 6px;
}
.tree-actions button {
  padding: 3px 0;
  font-size: 9px;
  white-space: nowrap;
  color: var(--muted);
}
.tree-actions button:hover:not(:disabled) {
  color: var(--ink);
}
.nav-items {
  display: grid;
  gap: 3px;
}
.nav-item {
  width: 100%;
  text-align: left;
  padding: 9px 8px;
  display: flex;
  gap: 6px;
  font-size: 12px;
}
.nav-item:hover,
.nav-item.active {
  background: var(--theme-selected);
}
.nav-end {
  margin-left: auto;
}
.nav-feature-status {
  font-size: 9px;
  color: var(--muted);
  flex-shrink: 0;
}
.new-feature-nav {
  border-top: 1px solid var(--line);
  margin-top: 10px;
  padding-top: 12px;
}
.feature-tree {
  min-width: 0;
}
.feature-group > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
}
.feature-group > summary::-webkit-details-marker {
  display: none;
}
.feature-group > summary small {
  margin-left: auto;
  font-size: 9px;
}
.group-chevron {
  display: inline-block;
  width: 8px;
  font-size: 16px;
  line-height: 1;
}
.feature-group[open] > summary > .group-chevron {
  transform: rotate(90deg);
}
.feature-group-children {
  margin-left: 10px;
  padding-left: 5px;
  border-left: 1px solid var(--line);
}
.feature-leaf > span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.workspace {
  min-width: 0;
}
.topbar {
  height: 76px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 27px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.breadcrumb strong {
  font-weight: 500;
  color: var(--ink);
  flex-shrink: 0;
}
#breadcrumb-section {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-actions {
  flex-shrink: 0;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  padding: 7px 12px;
  font-size: 12px;
  background: var(--paper);
}
.button:hover {
  border-color: var(--theme-border);
  background: var(--theme-soft-surface);
}
.button.primary {
  background: var(--ink);
  color: var(--theme-primary-text);
  border-color: var(--ink);
}
.button.text {
  padding: 0;
  border: 0;
  background: none;
}
.theme-toggle {
  width: 34px;
  height: 34px;
  padding: 0;
}
.page {
  max-width: 1380px;
  margin: auto;
  padding: 24px 27px;
  min-width: 0;
}
.page-heading {
  margin-bottom: 22px;
}
.page-heading h1 {
  font-size: 24px;
  font-weight: 600;
}
.journey-canvas {
  border: 1px solid var(--line);
  padding: 18px 20px 16px;
}
.journey-head {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.journey-head h2 {
  font-size: 15px;
  font-weight: 600;
}
.feature-name-editor {
  flex-wrap: wrap;
}
.feature-name-field {
  width: 180px;
  max-width: 100%;
  padding: 3px 5px;
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  background: none;
  font-weight: 600;
  line-height: 1.6;
}
.feature-name-field:focus {
  outline: 1px solid var(--muted);
}
.feature-name-editor > .button {
  font-size: 10px;
  padding: 4px 7px;
}
.diagram-gallery-nav {
  display: flex;
  border: 1px solid var(--line);
  padding: 3px;
  gap: 3px;
  margin-bottom: 12px;
}
.diagram-tab {
  flex: 1;
  white-space: nowrap;
  padding: 8px;
  font-size: 11px;
  color: var(--muted);
}
.diagram-tab.active {
  background: var(--theme-selected);
  color: var(--ink);
}
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  background: var(--theme-soft-surface);
  white-space: nowrap;
}
.document-summary {
  padding: 12px 0 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.document-editor-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.document-editor-heading label {
  font-size: 12px;
  font-weight: 600;
}
.document-status {
  font-size: 10px;
  color: var(--muted);
}
.document-group-field {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.document-group-field > label {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.document-group-field input,
#new-feature-group {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  padding: 6px 8px;
  background: var(--paper);
  font-size: 11px;
}
.document-summary textarea,
.feature-annotations textarea {
  display: block;
  width: 100%;
  min-height: 125px;
  border: 1px solid var(--line);
  padding: 10px 12px;
  background: var(--paper);
  font-size: 13px;
  line-height: 1.95;
  resize: vertical;
}
.feature-annotations {
  margin: 18px 0 22px;
  padding: 16px;
  border: 1px solid var(--line);
  background: var(--theme-soft-surface);
}
.feature-annotations p,
.document-access p {
  margin: 8px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.feature-annotations textarea {
  min-height: 90px;
}
.annotation-help {
  font-size: 11px !important;
}
.annotation-history {
  margin-top: 14px;
  font-size: 12px;
}
.annotation-record-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.annotation-history article {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.annotation-history p {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.annotation-history small {
  display: block;
  color: var(--muted);
  margin-bottom: 6px;
}
.document-access {
  margin: 18px 28px 0;
  padding: 14px 16px;
  border: 1px solid var(--line);
  font-size: 12px;
}
.document-access[hidden] {
  display: none;
}
.document-access summary {
  cursor: pointer;
}
.document-access code {
  display: block;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.document-editor-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.document-editor-actions > span {
  margin-right: auto;
  font-size: 10px;
  color: var(--muted);
}
.document-editor-actions .button {
  font-size: 11px;
  padding: 5px 9px;
}
.document-sync-note,
.document-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 14px;
}
.document-sync-note {
  border-left: 2px solid var(--line);
  padding: 6px 10px;
}
.flow-version-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.flow-version-bar h3 {
  font-size: 12px;
}
.flow-version-hint {
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
}
.empty-state {
  font-size: 12px;
  color: var(--muted);
  padding: 22px 12px;
  border: 1px solid var(--line);
}
.empty-state h3 {
  font-size: 13px;
  margin-bottom: 5px;
}
.graph-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  background: var(--bg);
}
.flow-graph {
  position: relative;
  margin: auto;
}
.graph-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.graph-edges text {
  font-size: 10px;
  fill: var(--muted);
}
.graph-node {
  position: absolute;
  top: 59px;
  width: 170px;
  height: 104px;
  border: 1px solid var(--theme-border);
  background: var(--paper);
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
}
.graph-node:hover,
.graph-node.selected {
  border-color: var(--ink);
  background: var(--theme-selected);
}
.graph-node-head {
  display: flex;
  gap: 7px;
  font-size: 9px;
  color: var(--muted);
}
.graph-node-head .mono {
  margin-right: auto;
}
.graph-node strong {
  font-size: 13px;
}
.graph-node-copy {
  font-size: 10px;
  color: var(--muted);
}
.graph-node-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: var(--muted);
  margin-top: auto;
}
.graph-node-meta svg {
  margin-left: auto;
}
.graph-failure {
  position: absolute;
  width: 275px;
  border: 1px solid var(--line);
  padding: 8px 10px;
  font-size: 10px;
  line-height: 1.6;
  background: var(--paper);
  color: var(--muted);
}
.graph-warning-label {
  fill: var(--muted);
}
.map-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  margin-bottom: 12px;
}
.map-title > span {
  font-size: 10px;
  color: var(--muted);
}
.map-canvas {
  width: 920px;
}
.map-node {
  position: absolute;
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 5px;
  border: 1px solid var(--theme-border);
  padding: 10px 12px;
  background: var(--paper);
}
.map-node:hover {
  background: var(--theme-selected);
  border-color: var(--ink);
}
.map-node-type {
  font-size: 9px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
.map-node strong {
  font-size: 13px;
}
.map-subtitle,
.map-fields {
  font-size: 10px;
  line-height: 1.7;
  color: var(--muted);
}
.map-fields {
  display: grid;
  gap: 2px;
  border-top: 1px solid var(--line);
  padding-top: 7px;
}
.diagram-footnote {
  font-size: 10px;
  color: var(--muted);
  margin-top: 10px;
}
.sequence-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
}
.sequence-title {
  font-size: 12px;
  font-weight: 600;
}
.sequence-scenario {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
}
.sequence-scenario select {
  border: 1px solid var(--line);
  padding: 5px 9px;
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
}
.sequence-step-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.sequence-step-button {
  display: flex;
  gap: 6px;
  border: 1px solid var(--line);
  padding: 6px 8px;
  font-size: 10px;
}
.sequence-step-button.active {
  background: var(--theme-selected);
}
.sequence-scroll {
  overflow-x: auto;
}
.sequence-svg {
  width: 100%;
  min-width: 540px;
  max-width: 880px;
  margin: auto;
}
.seq-role {
  font-size: 13px;
  font-weight: 600;
  fill: var(--ink);
}
.seq-message {
  font-size: 12px;
  fill: var(--ink);
}
.seq-order,
.seq-caption {
  font-size: 9px;
  fill: var(--muted);
}
.seq-response {
  fill: var(--muted);
}
.seq-lifeline {
  stroke: var(--seq-lifeline);
  stroke-width: 1.3;
  vector-effect: non-scaling-stroke;
}
.seq-role-box {
  stroke: var(--seq-role-border);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.sequence-legend {
  display: flex;
  gap: 16px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.sequence-legend > span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sequence-line {
  width: 22px;
  border-top: 2px solid var(--seq-request);
}
.sequence-line.return {
  border-top: 2px dashed var(--seq-return);
}
.modal {
  padding: 0;
  border: 1px solid var(--theme-border);
  width: 740px;
  max-width: calc(100vw - 36px);
  background: var(--paper);
  color: var(--ink);
}
.modal::backdrop {
  background: #0008;
  backdrop-filter: blur(2px);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.modal-title {
  font-size: 18px;
  font-weight: 600;
}
.icon-button {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
}
.passport-context {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}
.modal-body {
  padding: 14px 20px;
  max-height: calc(100vh - 150px);
  overflow: auto;
}
.passport-description {
  font-size: 12px;
  line-height: 1.9;
  margin-bottom: 14px;
}
.passport-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 18px;
}
.passport-section {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.passport-section h3 {
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 9px;
}
.passport-section h3 small {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
}
.passport-section p {
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}
.passport-rules {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 7px;
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}
.passport-dependencies {
  display: grid;
  gap: 6px;
}
.passport-dependencies button {
  padding: 5px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  text-align: left;
}
.passport-dependencies button > svg {
  margin-left: auto;
}
.passport-dependencies small {
  display: block;
  font-size: 10px;
  color: var(--muted);
}
.passport-warning {
  background: var(--theme-soft-surface);
  padding: 10px;
}
.passport-traces {
  margin-top: 16px;
}
.passport-traces ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
  font-size: 11px;
}
.passport-traces li {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 12px;
  color: var(--muted);
}
.passport-check {
  padding: 8px 10px;
  background: var(--theme-soft-surface);
  font-size: 11px;
  color: var(--muted);
  margin-top: 12px;
  line-height: 1.8;
}
.dep-document {
  max-width: 1060px;

  $('step-modal').addEventListener('click', (e) => {
    if (e.target === $('step-modal')) {
      const box = e.target.getBoundingClientRect();
      if (
        e.clientX < box.left ||
        e.clientX > box.right ||
        e.clientY < box.top ||
        e.clientY > box.bottom
      )
        e.target.close();
    }
  });
  document
    .querySelectorAll('.icon-button[data-close]')
    .forEach((button) => (button.innerHTML = icon('close', 17)));
  function renderThemeToggle() {
    const dark = document.documentElement.dataset.theme === 'dark',
      button = $('theme-toggle');
    button.innerHTML = icon(dark ? 'sun' : 'moon', 16);
    button.setAttribute('aria-label', dark ? '切换为浅色主题' : '切换为深色主题');
    button.title = (dark ? '当前为深色' : '当前为浅色') + '，点击切换';
  }
  $('theme-toggle').addEventListener('click', () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem('product-workbench-theme', theme);
    } catch {}
    renderThemeToggle();
  });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.view === 'feature') renderFeature();
      else if (state.view === 'overview' && state.projectDiagram !== 'summary') renderOverview();
    }, 100);
  });
  renderThemeToggle();
  applyProductDocument(embeddedDocument);
  render();
  loadProductDocument();
})();

    </script>
  </body>
</html>
