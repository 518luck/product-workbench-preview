<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="用自然语言记录产品背景、功能流程、业务规则和系统依赖。" />
    <title>产品蓝图</title>
    <script>
      (() => {
  let theme;
  try {
    theme = localStorage.getItem('product-workbench-theme');
  } catch {}
  if (theme !== 'light' && theme !== 'dark')
    theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
})();

    </script>
    <style>
      :root {
  --bg: #fff;
  --paper: #fff;
  --side: #fafafa;
  --ink: #171717;
  --muted: #737373;
  --line: #e5e5e5;
  --green: #171717;
  --green-soft: #f5f5f5;
  --orange: #737373;
  --theme-text: #171717;
  --theme-muted-text: #737373;
  --theme-paper: #fff;
  --theme-soft-surface: #f5f5f5;
  --theme-cool-surface: #fafafa;
  --theme-border: #d4d4d4;
  --theme-selected: #f0f0f0;
  --theme-selected-border: #737373;
  --theme-diagram-arrow: #737373;
  --theme-warning-text: #525252;
  --theme-primary-text: #fff;
  --seq-request: #333;
  --seq-return: #666;
  --seq-lifeline: #888;
  --seq-role-border: #ccc;
  color-scheme: light;
  font-family:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.65;
}
:root[data-theme='dark'] {
  --bg: #000;
  --paper: #0a0a0a;
  --side: #000;
  --ink: #ededed;
  --muted: #a3a3a3;
  --line: #262626;
  --green: #ededed;
  --green-soft: #171717;
  --theme-text: #ededed;
  --theme-muted-text: #a3a3a3;
  --theme-paper: #0a0a0a;
  --theme-soft-surface: #171717;
  --theme-cool-surface: #111;
  --theme-border: #404040;
  --theme-selected: #1a1a1a;
  --theme-selected-border: #a3a3a3;
  --theme-diagram-arrow: #a3a3a3;
  --theme-warning-text: #d4d4d4;
  --theme-primary-text: #000;
  --seq-request: #dedede;
  --seq-return: #b3b3b3;
  --seq-lifeline: #666;
  --seq-role-border: #555;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
}
h1,
h2,
h3,
p {
  margin: 0;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
  border-radius: 0;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button:focus-visible,
a:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 3px;
}
button svg {
  pointer-events: none;
}
svg {
  display: block;
}
.hidden,
[hidden] {
  display: none !important;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.small {
  font-size: 11px;
}
.muted {
  color: var(--muted);
}
.icon {
  flex-shrink: 0;
}
.app {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--side);
  border-right: 1px solid var(--line);
  min-width: 0;
}
.brand {
  display: grid;
  gap: 5px;
  padding: 0 10px 18px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand-name {
  font-size: 16px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.brand-subtitle {
  font-size: 11px;
  color: var(--muted);
}
.sidebar-top {
  display: grid;
  gap: 10px;
  flex-shrink: 0;
}
.overview-nav {
  padding: 8px 10px;
  text-align: left;
  font-size: 13px;
}
.overview-nav.active,
.overview-nav:hover {
  background: var(--theme-selected);
}
.view-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line);
  padding: 3px;
}
.view-tab {
  padding: 7px 3px;
  font-size: 12px;
  color: var(--muted);
}
.view-tab.active {
  background: var(--theme-selected);
  color: var(--ink);
}
.sidebar-directory {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-directory > nav {
  flex: 1;
  min-height: 0;
  overflow: auto;
  scrollbar-width: none;
}
.sidebar-directory > nav::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
.nav-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  flex-shrink: 0;
}
.nav-label {
  font-size: 10px;
  color: var(--muted);
  padding: 0 8px;
}
.tree-actions {
  display: flex;
  gap: 6px;
}
.tree-actions button {
  padding: 3px 0;
  font-size: 9px;
  white-space: nowrap;
  color: var(--muted);
}
.tree-actions button:hover:not(:disabled) {
  color: var(--ink);
}
.nav-items {
  display: grid;
  gap: 3px;
}
.nav-item {
  width: 100%;
  text-align: left;
  padding: 9px 8px;
  display: flex;
  gap: 6px;
  font-size: 12px;
}
.nav-item:hover,
.nav-item.active {
  background: var(--theme-selected);
}
.nav-end {
  margin-left: auto;
}
.nav-feature-status {
  font-size: 9px;
  color: var(--muted);
  flex-shrink: 0;
}
.new-feature-nav {
  border-top: 1px solid var(--line);
  margin-top: 10px;
  padding-top: 12px;
}
.feature-tree {
  min-width: 0;
}
.feature-group > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
}
.feature-group > summary::-webkit-details-marker {
  display: none;
}
.feature-group > summary small {
  margin-left: auto;
  font-size: 9px;
}
.group-chevron {
  display: inline-block;
  width: 8px;
  font-size: 16px;
  line-height: 1;
}
.feature-group[open] > summary > .group-chevron {
  transform: rotate(90deg);
}
.feature-group-children {
  margin-left: 10px;
  padding-left: 5px;
  border-left: 1px solid var(--line);
}
.feature-leaf > span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.workspace {
  min-width: 0;
}
.topbar {
  height: 76px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 27px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.breadcrumb strong {
  font-weight: 500;
  color: var(--ink);
  flex-shrink: 0;
}
#breadcrumb-section {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-actions {
  flex-shrink: 0;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  padding: 7px 12px;
  font-size: 12px;
  background: var(--paper);
}
.button:hover {
  border-color: var(--theme-border);
  background: var(--theme-soft-surface);
}
.button.primary {
  background: var(--ink);
  color: var(--theme-primary-text);
  border-color: var(--ink);
}
.button.text {
  padding: 0;
  border: 0;
  background: none;
}
.theme-toggle {
  width: 34px;
  height: 34px;
  padding: 0;
}
.page {
  max-width: 1380px;
  margin: auto;
  padding: 24px 27px;
  min-width: 0;
}
.page-heading {
  margin-bottom: 22px;
}
.page-heading h1 {
  font-size: 24px;
  font-weight: 600;
}
.journey-canvas {
  border: 1px solid var(--line);
  padding: 18px 20px 16px;
}
.journey-head {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.journey-head h2 {
  font-size: 15px;
  font-weight: 600;
}
.feature-name-editor {
  flex-wrap: wrap;
}
.feature-name-field {
  width: 180px;
  max-width: 100%;
  padding: 3px 5px;
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  background: none;
  font-weight: 600;
  line-height: 1.6;
}
.feature-name-field:focus {
  outline: 1px solid var(--muted);
}
.feature-name-editor > .button {
  font-size: 10px;
  padding: 4px 7px;
}
.diagram-gallery-nav {
  display: flex;
  border: 1px solid var(--line);
  padding: 3px;
  gap: 3px;
  margin-bottom: 12px;
}
.diagram-tab {
  flex: 1;
  white-space: nowrap;
  padding: 8px;
  font-size: 11px;
  color: var(--muted);
}
.diagram-tab.active {
  background: var(--theme-selected);
  color: var(--ink);
}
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  background: var(--theme-soft-surface);
  white-space: nowrap;
}
.document-summary {
  padding: 12px 0 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.document-editor-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.document-editor-heading label {
  font-size: 12px;
  font-weight: 600;
}
.document-status {
  font-size: 10px;
  color: var(--muted);
}
.document-group-field {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.document-group-field > label {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.document-group-field input,
#new-feature-group {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  padding: 6px 8px;
  background: var(--paper);
  font-size: 11px;
}
.document-summary textarea,
.feature-annotations textarea {
  display: block;
  width: 100%;
  min-height: 125px;
  border: 1px solid var(--line);
  padding: 10px 12px;
  background: var(--paper);
  font-size: 13px;
  line-height: 1.95;
  resize: vertical;
}
.feature-annotations {
  margin: 18px 0 22px;
  padding: 16px;
  border: 1px solid var(--line);
  background: var(--theme-soft-surface);
}
.feature-annotations p,
.document-access p {
  margin: 8px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.feature-annotations textarea {
  min-height: 90px;
}
.annotation-help {
  font-size: 11px !important;
}
.annotation-history {
  margin-top: 14px;
  font-size: 12px;
}
.annotation-record-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.annotation-history article {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.annotation-history p {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.annotation-history small {
  display: block;
  color: var(--muted);
  margin-bottom: 6px;
}
.document-access {
  margin: 18px 28px 0;
  padding: 14px 16px;
  border: 1px solid var(--line);
  font-size: 12px;
}
.document-access[hidden] {
  display: none;
}
.document-access summary {
  cursor: pointer;
}
.document-access code {
  display: block;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.document-editor-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.document-editor-actions > span {
  margin-right: auto;
  font-size: 10px;
  color: var(--muted);
}
.document-editor-actions .button {
  font-size: 11px;
  padding: 5px 9px;
}
.document-sync-note,
.document-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 14px;
}
.document-sync-note {
  border-left: 2px solid var(--line);
  padding: 6px 10px;
}
.flow-version-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.flow-version-bar h3 {
  font-size: 12px;
}
.flow-version-hint {
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
}
.empty-state {
  font-size: 12px;
  color: var(--muted);
  padding: 22px 12px;
  border: 1px solid var(--line);
}
.empty-state h3 {
  font-size: 13px;
  margin-bottom: 5px;
}
.graph-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  background: var(--bg);
}
.flow-graph {
  position: relative;
  margin: auto;
}
.graph-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.graph-edges text {
  font-size: 10px;
  fill: var(--muted);
}
.graph-node {
  position: absolute;
  top: 59px;
  width: 170px;
  height: 104px;
  border: 1px solid var(--theme-border);
  background: var(--paper);
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
}
.graph-node:hover,
.graph-node.selected {
  border-color: var(--ink);
  background: var(--theme-selected);
}
.graph-node-head {
  display: flex;
  gap: 7px;
  font-size: 9px;
  color: var(--muted);
}
.graph-node-head .mono {
  margin-right: auto;
}
.graph-node strong {
  font-size: 13px;
}
.graph-node-copy {
  font-size: 10px;
  color: var(--muted);
}
.graph-node-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: var(--muted);
  margin-top: auto;
}
.graph-node-meta svg {
  margin-left: auto;
}
.graph-failure {
  position: absolute;
  width: 275px;
  border: 1px solid var(--line);
  padding: 8px 10px;
  font-size: 10px;
  line-height: 1.6;
  background: var(--paper);
  color: var(--muted);
}
.graph-warning-label {
  fill: var(--muted);
}
.map-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  margin-bottom: 12px;
}
.map-title > span {
  font-size: 10px;
  color: var(--muted);
}
.map-canvas {
  width: 920px;
}
.map-node {
  position: absolute;
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 5px;
  border: 1px solid var(--theme-border);
  padding: 10px 12px;
  background: var(--paper);
}
.map-node:hover {
  background: var(--theme-selected);
  border-color: var(--ink);
}
.map-node-type {
  font-size: 9px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
.map-node strong {
  font-size: 13px;
}
.map-subtitle,
.map-fields {
  font-size: 10px;
  line-height: 1.7;
  color: var(--muted);
}
.map-fields {
  display: grid;
  gap: 2px;
  border-top: 1px solid var(--line);
  padding-top: 7px;
}
.diagram-footnote {
  font-size: 10px;
  color: var(--muted);
  margin-top: 10px;
}
.sequence-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
}
.sequence-title {
  font-size: 12px;
  font-weight: 600;
}
.sequence-scenario {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
}
.sequence-scenario select {
  border: 1px solid var(--line);
  padding: 5px 9px;
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
}
.sequence-step-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.sequence-step-button {
  display: flex;
  gap: 6px;
  border: 1px solid var(--line);
  padding: 6px 8px;
  font-size: 10px;
}
.sequence-step-button.active {
  background: var(--theme-selected);
}
.sequence-scroll {
  overflow-x: auto;
}
.sequence-svg {
  width: 100%;
  min-width: 540px;
  max-width: 880px;
  margin: auto;
}
.seq-role {
  font-size: 13px;
  font-weight: 600;
  fill: var(--ink);
}
.seq-message {
  font-size: 12px;
  fill: var(--ink);
}
.seq-order,
.seq-caption {
  font-size: 9px;
  fill: var(--muted);
}
.seq-response {
  fill: var(--muted);
}
.seq-lifeline {
  stroke: var(--seq-lifeline);
  stroke-width: 1.3;
  vector-effect: non-scaling-stroke;
}
.seq-role-box {
  stroke: var(--seq-role-border);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.sequence-legend {
  display: flex;
  gap: 16px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.sequence-legend > span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sequence-line {
  width: 22px;
  border-top: 2px solid var(--seq-request);
}
.sequence-line.return {
  border-top: 2px dashed var(--seq-return);
}
.modal {
  padding: 0;
  border: 1px solid var(--theme-border);
  width: 740px;
  max-width: calc(100vw - 36px);
  background: var(--paper);
  color: var(--ink);
}
.modal::backdrop {
  background: #0008;
  backdrop-filter: blur(2px);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.modal-title {
  font-size: 18px;
  font-weight: 600;
}
.icon-button {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
}
.passport-context {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}
.modal-body {
  padding: 14px 20px;
  max-height: calc(100vh - 150px);
  overflow: auto;
}
.passport-description {
  font-size: 12px;
  line-height: 1.9;
  margin-bottom: 14px;
}
.passport-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 18px;
}
.passport-section {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.passport-section h3 {
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 9px;
}
.passport-section h3 small {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
}
.passport-section p {
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}
.passport-rules {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 7px;
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}
.passport-dependencies {
  display: grid;
  gap: 6px;
}
.passport-dependencies button {
  padding: 5px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  text-align: left;
}
.passport-dependencies button > svg {
  margin-left: auto;
}
.passport-dependencies small {
  display: block;
  font-size: 10px;
  color: var(--muted);
}
.passport-warning {
  background: var(--theme-soft-surface);
  padding: 10px;
}
.passport-traces {
  margin-top: 16px;
}
.passport-traces ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
  font-size: 11px;
}
.passport-traces li {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 12px;
  color: var(--muted);
}
.passport-check {
  padding: 8px 10px;
  background: var(--theme-soft-surface);
  font-size: 11px;
  color: var(--muted);
  margin-top: 12px;
  line-height: 1.8;
}
.dep-document {
  max-width: 1060px;

e":"产品蓝图 CLI","type":"interface","description":"读取、校验、变更、分析、验收与渲染文档。"},{"id":"document","title":"产品 JSON 与 HTML","type":"storage","description":"本机保存共享上下文与阅读入口。"},{"id":"project","title":"目标项目","type":"source","description":"源码与配置作为行为核验依据。"},{"id":"analysis","title":"源码分析与验收","type":"service","description":"绑定源码快照、字段依据和真实执行结果。"},{"id":"skill-init","title":"初始化产品书","type":"workflow","description":"为项目首次生成可阅读的产品书：从现有源码梳理产品功能，或根据新产品需求建立蓝图草稿；已有蓝图的修改使用维护流程。"},{"id":"skill-maintain","title":"维护需求与蓝图","type":"workflow","description":"更新已有产品蓝图：整理需求变更、评估业务影响或同步代码变化后的产品文档；仅修改蓝图，不实现项目代码。"},{"id":"skill-implement","title":"按蓝图实现与验收","type":"workflow","description":"按产品蓝图实现或核验项目功能：处理已保存的定义、批注及相关源码变化，完成代码修改、真实验收和蓝图同步。"},{"id":"service","title":"本机文档服务","type":"service","description":"仅监听本机，提供页面保存定义与批注的入口。"}],"edges":[{"from":"human","to":"html","label":"阅读与输入需求"},{"from":"human","to":"ai-host","label":"自然语言协作"},{"from":"ai-host","to":"skills","label":"调用 Skill"},{"from":"html","to":"document","label":"读取或编辑"},{"from":"cli","to":"document","label":"校验、保存和渲染"},{"from":"analysis","to":"project","label":"读取与比较源码"},{"from":"analysis","to":"document","label":"绑定字段与完成证据"},{"from":"skills","to":"skill-init","label":"选择独立入口"},{"from":"skills","to":"skill-maintain","label":"选择独立入口"},{"from":"skills","to":"skill-implement","label":"选择独立入口"},{"from":"skill-init","to":"project","label":"读取源码和工作流，不改代码"},{"from":"skill-maintain","to":"project","label":"只读核对业务差异"},{"from":"skill-implement","to":"project","label":"修改已授权范围内代码"},{"from":"skill-init","to":"cli","label":"生成产品书并核验状态"},{"from":"skill-maintain","to":"cli","label":"预览保存蓝图后结束"},{"from":"skill-implement","to":"cli","label":"实际验收、同步与完成"},{"from":"html","to":"service","label":"页面保存请求"},{"from":"service","to":"document","label":"校验并写回文档"}]},"entities":{"title":"产品蓝图核心数据关系","nodes":[{"id":"product","title":"产品","type":"entity","fields":["name","background","actors"],"description":"产品背景、名称、角色与说明。"},{"id":"feature","title":"功能","type":"entity","fields":["stable id","revision","definition","flow","rules","dependencies","implementation"],"description":"稳定编号的功能定义、规则、流程、批注、图表与版本。"},{"id":"annotation","title":"批注","type":"entity","fields":["stable id","text","definitionRevision"],"description":"用户批注原文、编号、时间及所针对的定义版本。"},{"id":"dependency","title":"依赖","type":"entity","fields":["stable id","name","purpose","relations"],"description":"功能与步骤引用的外部系统、运行时或资料。"},{"id":"analysis-session","title":"源码分析会话","type":"entity","fields":["snapshotHash","read receipts","records","traces"],"description":"扫描清单、读取凭据、单元记录与字段依据，绑定源码指纹。"},{"id":"verification","title":"验收执行","type":"entity","fields":["executionId","feature revision","exit status","output hash","source snapshot"],"description":"显式验收命令的退出码、输出指纹、定义与源码证据。"},{"id":"delivery-review","title":"交付审阅","type":"entity","fields":["documentHash","feature coverage","journeys","diagrams"],"description":"绑定文档哈希的核心旅程、逐功能状态、图表与验收映射。"}],"edges":[{"from":"product","to":"feature","label":"包含","relation":true},{"from":"feature","to":"annotation","label":"拥有待处理批注","relation":true},{"from":"feature","to":"dependency","label":"引用","relation":true},{"from":"analysis-session","to":"feature","label":"为业务字段绑定源码依据","relation":true},{"from":"verification","to":"feature","label":"按定义版本验收","relation":true},{"from":"verification","to":"analysis-session","label":"绑定源码快照","relation":true},{"from":"delivery-review","to":"feature","label":"逐功能审阅","relation":true},{"from":"delivery-review","to":"verification","label":"引用真实执行记录","relation":true}]}}}
    </script>
    <script>
      (() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const paths = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
    moon: '<path d="M20.5 13A8.7 8.7 0 0 1 11 3.5a9 9 0 1 0 9.5 9.5Z"/>',
    chevron: '<path d="m9 5 7 7-7 7"/>',
    close: '<path d="m6 6 12 12M6 18 18 6"/>',
  };
  const icon = (name, size = 18) =>
    `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:${size}px;height:${size}px">${paths[name] || ''}</svg>`;
  const esc = (value) =>
    String(value).replace(
      /[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
    );
  const embeddedDocument = JSON.parse($('product-data').textContent);
  const features = [];
  const dependencies = [];
  const initial = {
    mode: 'business',
    view: 'feature',
    feature: Object.keys(embeddedDocument.features)[0] || '',
    dependency: embeddedDocument.dependencies?.[0]?.id || '',
    selectedStep: 0,
    diagramView: 'flow',
    projectDiagram: 'summary',
    sequenceCase: 'success',
  };
  let state = { ...initial };
  let productDocument = { features: {} };
  let documentAvailable = false;
  let documentLoading = true;
  let sourceStatus = null;
  let checkingSource = false;
  let sourceCheckError = '';
  const annotationDrafts = new Map();
  let savingAnnotation = false;
  let annotationRemoval = null;
  const descriptionEdits = new Map();
  const groupEdits = new Map();
  const titleEdits = new Map();
  let savingTitle = false;
  function updateTitleEditor() {
    const f = featureById(state.feature),
      field = $('feature-name');
    if (!field) return;
    const changed = field.value.trim() !== f.title.trim(),
      valid = field.value.trim().length > 0 && field.value.trim().length <= 80;
    $('feature-name-save').hidden = !changed && !savingTitle;
    $('feature-name-cancel').hidden = !changed && !savingTitle;
    $('feature-name-save').disabled = !documentAvailable || savingTitle || !changed || !valid;
    $('feature-name-cancel').disabled = savingTitle;
    $('feature-name-save').textContent = savingTitle ? '保存中…' : '保存名称';
    $('feature-name-status').textContent =
      changed && !valid ? '名称为 1–80 字' : changed ? '名称未保存' : '';
  }
  async function saveFeatureTitle() {
    const f = featureById(state.feature),
      title = $('feature-name').value;
    if (!title.trim() || title.trim().length > 80 || savingTitle || !documentAvailable) return;
    savingTitle = true;
    updateTitleEditor();
    try {
      const r = documentRecord(f),
        response = await fetch('/document/features/' + encodeURIComponent(f.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            description: activeContent(f).description,
            expectedRevision: r?.revision ?? 0,
            expectedEditRevision: r?.editRevision ?? 0,
          }),
        });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '保存名称失败，请重试。');
      productDocument.features[f.id] = result;
      applyProductDocument(productDocument);
      if (titleEdits.get(f.id) === title) titleEdits.delete(f.id);
      if (state.feature === f.id && state.mode === 'business') render();
      toast('名称已保存。');
    } catch (error) {
      toast(error.message || '名称未保存，输入内容仍保留。');
    } finally {
      savingTitle = false;
      updateTitleEditor();
    }
  }
  const expandedGroups = new Map();
  const parseGroupPath = (value) =>
    String(value || '')
      .split(/[\/／>]/)
      .map((part) => part.trim())
      .filter(Boolean);
  const validGroupPath = (parts) => parts.length <= 5 && parts.every((part) => part.length <= 40);
  const featureGroups = (f) =>
    Array.isArray(documentRecord(f)?.groupPath) ? documentRecord(f).groupPath : [];
  const groupPathText = (f) => featureGroups(f).join(' / ');
  function groupOptions() {
    const paths = new Set();
    for (const f of documentFeatures()) {
      const parts = featureGroups(f);
      for (let i = 1; i <= parts.length; i++) paths.add(parts.slice(0, i).join(' / '));
    }
    return `<datalist id="feature-group-options">${[...paths].map((p) => `<option value="${esc(p)}"></option>`).join('')}</datalist>`;
  }
  function openFeatureGroups(f) {
    const parts = [...featureGroups(f)];
    if (!parts.length) parts.push('未分组');
    for (let i = 1; i <= parts.length; i++)
      expandedGroups.set(JSON.stringify(parts.slice(0, i)), true);
  }
  function renderFeatureTree() {
    const tree = { groups: new Map(), features: [] };
    for (const f of documentFeatures()) {
      const parts = featureGroups(f).length ? featureGroups(f) : ['未分组'];
      let node = tree;
      for (const part of parts) {
        if (!node.groups.has(part))
          node.groups.set(part, { groups: new Map(), features: [], count: 0 });
        node = node.groups.get(part);
        node.count++;
      }
      node.features.push(f);
    }
    function branch(node, path = []) {
      const groups = [...node.groups]
        .map(([title, child]) => {
          const parts = [...path, title],
            key = JSON.stringify(parts),
            active =
              state.view === 'feature' &&
              JSON.stringify(
                (featureGroups(featureById(state.feature)).length
                  ? featureGroups(featureById(state.feature))
                  : ['未分组']
                ).slice(0, parts.length),
              ) === key;
          const open = expandedGroups.has(key)
            ? expandedGroups.get(key)
            : path.length === 0 || active;
          return `<details class="feature-group" data-feature-group="${esc(key)}" ${open ? 'open' : ''}><summary aria-label="分组 ${esc(parts.join(' / '))}"><span class="group-chevron" aria-hidden="true">›</span><span>${esc(title)}</span><small>${child.count}</small></summary><div class="feature-group-children">${branch(child, parts)}</div></details>`;
        })
        .join('');
      const leaves = node.features
        .map(
          (f) =>
            `<button type="button" class="nav-item feature-leaf ${state.view === 'feature' && state.feature === f.id ? 'active' : ''}" data-feature="${esc(f.id)}" ${state.view === 'feature' && state.feature === f.id ? 'aria-current="page"' : ''}><span>${esc(documentRecord(f)?.title || f.title)}</span><span class="nav-end nav-feature-status">${featureStatus(f)}</span></button>`,
        )
        .join('');
      return groups + leaves;
    }
    return `<div class="feature-tree">${branch(tree)}</div><button type="button" class="nav-item new-feature-nav" data-new-feature>＋ 新增功能</button>`;
  }
  function updateTreeControls() {
    const groups = [...$('navigation').querySelectorAll('details.feature-group')];
    $('tree-actions').hidden = state.mode !== 'business' || groups.length === 0;
    $('tree-expand').disabled = groups.length === 0 || groups.every((group) => group.open);
    $('tree-collapse').disabled = !groups.some((group) => group.open);
  }
  function setAllFeatureGroups(open) {
    for (const group of $('navigation').querySelectorAll('details.feature-group')) {
      expandedGroups.set(group.dataset.featureGroup, open);
      group.open = open;
    }
    updateTreeControls();
  }
  let savingDescription = false;
  let newFeatureDraft = { id: '', title: '', description: '', groupPathText: '' };
  let creatingFeature = false;
  function openNewFeature() {
    state.mode = 'business';
    state.view = 'new-feature';
    render();
    $('new-feature-title').focus();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function updateNewFeatureForm() {
    const button = $('new-feature-save');
    if (!button) return;
    button.disabled =
      !documentAvailable ||
      creatingFeature ||
      !newFeatureDraft.title.trim() ||
      !newFeatureDraft.description.trim() ||
      !validGroupPath(parseGroupPath(newFeatureDraft.groupPathText));
    button.textContent = creatingFeature ? '保存中…' : '保存草稿';
  }
  function renderNewFeature() {
    $('page').innerHTML =
      `<article class="journey-canvas new-feature-document"><div class="journey-head"><h2>新增功能</h2><span class="document-status">草稿</span></div><form id="new-feature-form"><label class="new-feature-label" for="new-feature-title">功能名称</label><input id="new-feature-title" aria-label="功能名称" type="text" required maxlength="80" placeholder="填写功能名称" value="${esc(newFeatureDraft.title)}"><div class="new-feature-group-field"><label class="new-feature-label" for="new-feature-group">所属分组</label><input id="new-feature-group" aria-label="所属分组" list="feature-group-options" maxlength="215" placeholder="模块 / 子模块；留空为未分组" value="${esc(newFeatureDraft.groupPathText)}">${groupOptions()}</div><section class="document-summary"><div class="document-editor-heading"><label for="new-feature-definition">功能定义</label></div><textarea id="new-feature-definition" aria-label="新功能定义" required maxlength="5000" rows="6" placeholder="写下这个功能应当怎样运转。">${esc(newFeatureDraft.description)}</textarea></section><div class="document-editor-actions"><button class="button" type="button" data-cancel-new-feature>取消</button><button class="button" id="new-feature-save" type="submit" disabled>保存草稿</button></div></form></article>`;
    updateNewFeatureForm();
  }
  async function createDocumentFeature() {
    if (
      creatingFeature ||
      !documentAvailable ||
      !newFeatureDraft.title.trim() ||
      !newFeatureDraft.description.trim() ||
      !validGroupPath(parseGroupPath(newFeatureDraft.groupPathText))
    )
      return;
    if (!newFeatureDraft.id) newFeatureDraft.id = 'new-' + crypto.randomUUID();
    const sent = { ...newFeatureDraft };
    creatingFeature = true;
    updateNewFeatureForm();
    try {
      const context = { title: sent.title.trim() };
      const response = await fetch('/document/features/' + encodeURIComponent(sent.id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          create: true,
          description: sent.description,
          groupPath: parseGroupPath(sent.groupPathText),
          expectedRevision: 0,
          expectedEditRevision: 0,
          context,
        }),
      });
      const record = await response.json();
      if (!response.ok) throw new Error(record.error || '保存失败，请重试。');
      productDocument.features[sent.id] = record;
      applyProductDocument(productDocument);
      newFeatureDraft = { id: '', title: '', description: '', groupPathText: '' };
      state.diagramView = 'flow';
      setFeature(sent.id);
      toast('新功能已保存为草稿，等待 AI 梳理流程。');
    } catch (error) {
      toast(error.message || '保存失败，输入内容仍保留。');
    } finally {
      creatingFeature = false;
      updateNewFeatureForm();
    }
  }
  const documentRecord = (f) => productDocument.features[f.id];
  const featureStatus = (f) => {
    const r = documentRecord(f);
    return r && Number.isInteger(r.implementedRevision) && r.implementedRevision === r.revision
      ? '完成'
      : '草稿';
  };
  function applyProductDocument(doc) {
    productDocument = doc;
    features.splice(
      0,
      features.length,
      ...Object.entries(doc.features || {})
        .filter(
          ([, r]) =>
            r &&
            typeof r.title === 'string' &&
            typeof r.description === 'string' &&
            Array.isArray(r.flow) &&
            Array.isArray(r.rules),
        )
        .map(([id, r]) => ({
          actors: [],
          dependencies: [],
          checks: [],
          impact: [],
          overview: r.description,
          stepDetails: [],
          ...r,
          id,
        })),
    );
    dependencies.splice(0, dependencies.length, ...(doc.dependencies || []));
    if (!featureById(state.feature)) state.feature = features[0]?.id || '';
    if (!depById(state.dependency)) state.dependency = dependencies[0]?.id || '';
    if (!features.length) state.view = 'overview';
    const name = doc.product?.name || '产品蓝图';
    document.title = '产品蓝图 · ' + name;
    document.querySelector('.brand-name').textContent = name;
    document.querySelector('.breadcrumb strong').textContent = name;
    document.querySelector('meta[name="description"]').content =
      '用自然语言记录产品背景、功能流程、业务规则和系统依赖。';
  }
  async function loadProductDocument() {
    if (location.protocol === 'file:') {
      documentLoading = false;

  }
  const diagramKinds = [

  function activeDiagram() {

  function graphModel(f) {

  }
  function layoutMap(model, width) {
    const columns = Math.max(1, Math.min(3, Math.floor((width - 52) / 200))),
      gap = 38,
      nodeWidth = (width - 52 - gap * (columns - 1)) / columns,
      ranks = new Map(),
      incoming = new Map(model.nodes.map((n) => [n.id, 0]));
    const outgoing = new Map(model.nodes.map((n) => [n.id, []]));
    for (const e of model.edges) {
      if (e.from !== e.to && incoming.has(e.to) && outgoing.has(e.from)) {
        incoming.set(e.to, incoming.get(e.to) + 1);
        outgoing.get(e.from).push(e.to);
      }

    const queue = model.nodes.filter((n) => incoming.get(n.id) === 0).map((n) => n.id);
    queue.forEach((id) => ranks.set(id, 0));
    for (let i = 0; i < queue.length; i++) {
      const id = queue[i];
      for (const to of outgoing.get(id)) {

    const placed = new Map();
    for (const [rank, nodes] of [...groups].sort((a, b) => a[0] - b[0])) {

          .filter((e) => e.to === n.id)
          .map((e) => placed.get(e.from))
          .filter(Boolean);

          ? parents.reduce((sum, p) => sum + p.x, 0) / parents.length

  function renderMap(f) {

      layout = layoutMap(model, width),
      byId = new Map(layout.nodes.map((n) => [n.id, n]));

          x = from.x + from.w + 12;
          y = from.y + from.h / 2;
          path = `M${from.x + from.w} ${y - 12} H${x + 5} V${y + 12} H${from.x + from.w + 4}`;
        } else if (from.y === to.y) {

            x1 = right ? from.x + from.w : from.x,
            x2 = right ? to.x : to.x + to.w;
          y = from.y + from.h / 2;

            endX = to.x + to.w / 2,
            endY = down ? to.y : to.y + to.h;

            (n) =>
              n.id !== from.id &&
              n.id !== to.id &&
              n.y > Math.min(from.y, to.y) &&

            const outY = startY + (down ? 24 : -24);
            path = `M${startX} ${startY} V${outY} H${gutter} V${laneY} H${endX} V${endY + (down ? -5 : 5)}`;
            x = (gutter + endX) / 2;
          } else {
            path = `M${startX} ${startY} V${laneY} H${endX} V${endY - 5}`;

      )

      .map(

  }

      tabs = `<div class="diagram-gallery-nav" role="group" aria-label="项目内容">${projectDiagramKinds.map((k) => `<button class="diagram-tab ${state.projectDiagram === k.id ? 'active' : ''}" type="button" data-project-diagram="${k.id}" aria-pressed="${state.projectDiagram === k.id}">${k.name}</button>`).join('')}</div>`;
    const groups = new Map();
    for (const f of documentFeatures()) {
      const name = featureGroups(f).join(' / ') || '未分组';
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(f);
    }
    const summary = `<div class="content-grid"><article><p class="overview-intro">${esc(p.background || '尚未记录产品背景。')}</p><div class="section-heading"><h2>功能</h2></div><div class="overview-list">${[...groups].map(([name, items]) => `<section class="overview-group"><h3>${esc(name)}</h3>${items.map((f) => `<button class="overview-feature" type="button" data-feature="${esc(f.id)}"><div class="overview-feature-title">${esc(f.title)} <span class="document-status">${featureStatus(f)}</span></div><div class="overview-feature-description">${esc(f.overview || f.description)}</div></button>`).join('')}</section>`).join('')}</div></article>${p.actors?.length ? `<aside class="aside"><div class="aside-heading">谁在使用</div>${p.actors.map((actor) => `<div class="person-row">${esc(actor)}</div>`).join('')}</aside>` : ''}</div>`;
    $('page').innerHTML =
      pageHead('', esc(p.name || '产品蓝图')) +
      tabs +
      (state.projectDiagram === 'summary' ? summary : renderMap());
  }
  function render() {
    renderDocumentAccess();
    renderSourceStatus();
    $('page').classList.toggle(
      'dependency-page',
      state.mode === 'dependencies' && state.view === 'dependencies',
    );
    $('page').classList.toggle(
      'journey-page',
      state.view === 'feature' && state.mode === 'business',
    );
    renderNavigation();
    if (state.view === 'new-feature') renderNewFeature();
    else if (state.view === 'overview') renderOverview();
    else if (state.mode === 'dependencies') renderDependencies();
    else renderFeature();
  }
  document.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.hasAttribute('data-tree-open'))
      setAllFeatureGroups(button.dataset.treeOpen === 'true');
    else if (button.hasAttribute('data-source-check')) refreshSourceStatus();
    else if (button.hasAttribute('data-annotation-save')) saveAnnotation();
    else if (button.dataset.annotationEdit) editAnnotation(button.dataset.annotationEdit);
    else if (button.hasAttribute('data-annotation-edit-cancel')) cancelAnnotationEdit();
    else if (button.dataset.annotationRemove) {
      annotationRemoval = {
        featureId: state.feature,
        annotationId: button.dataset.annotationRemove,
      };
      renderFeature();
    } else if (button.dataset.annotationRemoveConfirm)
      removeAnnotation(button.dataset.annotationRemoveConfirm);
    else if (button.hasAttribute('data-annotation-remove-cancel')) {
      annotationRemoval = null;
      renderFeature();
    } else if (button.hasAttribute('data-save-feature-title')) saveFeatureTitle();
    else if (button.hasAttribute('data-cancel-feature-title')) {
      titleEdits.delete(state.feature);
      renderFeature();
    } else if (button.hasAttribute('data-document-save')) saveDescription();
    else if (button.hasAttribute('data-document-discard')) {
      descriptionEdits.delete(state.feature);
      groupEdits.delete(state.feature);
      renderFeature();
    } else if (button.dataset.feature) {
      $('step-modal').close();
      setFeature(button.dataset.feature);
    } else if (button.dataset.depFeature) {
      state.diagramView = 'flow';
      setFeature(button.dataset.depFeature);
    } else if (button.dataset.dependency) {
      $('step-modal').close();
      setDependency(button.dataset.dependency);
    } else if (button.dataset.mode) navigate(button.dataset.mode);
    else if (button.hasAttribute('data-new-feature')) openNewFeature();
    else if (button.hasAttribute('data-cancel-new-feature')) {
      if (!creatingFeature) {
        newFeatureDraft = { id: '', title: '', description: '', groupPathText: '' };
        state.view = features.length ? 'feature' : 'overview';
        render();
      }
    } else if (button.dataset.mapNode) openMapDetails(button.dataset.mapNode);
    else if (button.dataset.projectDiagram) {
      state.projectDiagram = button.dataset.projectDiagram;
      renderOverview();
    } else if (button.dataset.diagram) {
      state.diagramView = button.dataset.diagram;
      renderFeature();
    } else if (button.hasAttribute('data-step')) {
      state.selectedStep = Number(button.dataset.step);
      renderFeature();
      openStepDetails(state.selectedStep);
    } else if (button.dataset.close) $(button.dataset.close).close();
  });
  document.addEventListener('input', (event) => {
    const el = event.target;
    if (el.id === 'feature-annotation') {
      rememberAnnotation(state.feature, el.value);
      updateAnnotationEditor();
    } else if (el.id === 'feature-name') {
      titleEdits.set(state.feature, el.value);
      updateTitleEditor();
    } else if (el.id === 'new-feature-title') {
      newFeatureDraft.title = el.value;
      updateNewFeatureForm();
    } else if (el.id === 'new-feature-group') {
      newFeatureDraft.groupPathText = el.value;
      updateNewFeatureForm();
    } else if (el.id === 'new-feature-definition') {
      newFeatureDraft.description = el.value;
      updateNewFeatureForm();
    } else if (el.id === 'document-group-path') {
      groupEdits.set(state.feature, el.value);
      updateDescriptionEditor();
    } else if (el.id === 'feature-description') {
      descriptionEdits.set(state.feature, el.value);
      updateDescriptionEditor();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.target.id === 'feature-name') {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (!$('feature-name-save').disabled) saveFeatureTitle();
      } else if (event.key === 'Escape') {
        titleEdits.delete(state.feature);
        renderFeature();
      }
    }
  });
  document.addEventListener('change', (event) => {
    if (event.target.id === 'shared-sequence-case') {
      state.sequenceCase = event.target.value;
      renderFeature();
    }
  });
  document.addEventListener(
    'toggle',
    (event) => {
      if (event.target.isConnected && event.target.classList?.contains('feature-group')) {
        expandedGroups.set(event.target.dataset.featureGroup, event.target.open);
        updateTreeControls();
      }
    },
    true,
  );
  document.addEventListener('submit', (event) => {
    if (event.target.id === 'new-feature-form') {
      event.preventDefault();
      createDocumentFeature();
    }
  });
  $('overview-button').addEventListener('click', () => {
    state.mode = 'business';
    state.view = 'overview';
    render();
  });
  $('step-modal').addEventListener('click', (e) => {
    if (e.target === $('step-modal')) {
      const box = e.target.getBoundingClientRect();
      if (
        e.clientX < box.left ||
        e.clientX > box.right ||
        e.clientY < box.top ||
        e.clientY > box.bottom
      )
        e.target.close();
    }
  });
  document
    .querySelectorAll('.icon-button[data-close]')
    .forEach((button) => (button.innerHTML = icon('close', 17)));
  function renderThemeToggle() {
    const dark = document.documentElement.dataset.theme === 'dark',
      button = $('theme-toggle');
    button.innerHTML = icon(dark ? 'sun' : 'moon', 16);
    button.setAttribute('aria-label', dark ? '切换为浅色主题' : '切换为深色主题');
    button.title = (dark ? '当前为深色' : '当前为浅色') + '，点击切换';
  }
  $('theme-toggle').addEventListener('click', () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem('product-workbench-theme', theme);
    } catch {}
    renderThemeToggle();
  });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.view === 'feature') renderFeature();
      else if (state.view === 'overview' && state.projectDiagram !== 'summary') renderOverview();
    }, 100);
  });
  renderThemeToggle();
  applyProductDocument(embeddedDocument);
  render();
  loadProductDocument();
})();

    </script>
  </body>
</html>
