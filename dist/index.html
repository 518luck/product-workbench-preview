<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="用自然语言记录产品背景、功能流程、业务规则和系统依赖。" />
    <title>产品蓝图</title>
    <script>
      (() => {
  let theme;
  try {
    theme = localStorage.getItem('product-workbench-theme');
  } catch {}
  if (theme !== 'light' && theme !== 'dark')
    theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
})();

    </script>
    <style>
      :root {
  --bg: #fff;
  --paper: #fff;
  --side: #fafafa;
  --ink: #171717;
  --muted: #737373;
  --line: #e5e5e5;
  --green: #171717;
  --green-soft: #f5f5f5;
  --orange: #737373;
  --theme-text: #171717;
  --theme-muted-text: #737373;
  --theme-paper: #fff;
  --theme-soft-surface: #f5f5f5;
  --theme-cool-surface: #fafafa;
  --theme-border: #d4d4d4;
  --theme-selected: #f0f0f0;
  --theme-selected-border: #737373;
  --theme-diagram-arrow: #737373;
  --theme-warning-text: #525252;
  --theme-primary-text: #fff;
  --seq-request: #333;
  --seq-return: #666;
  --seq-lifeline: #888;
  --seq-role-border: #ccc;
  color-scheme: light;
  font-family:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.65;
}
:root[data-theme='dark'] {
  --bg: #000;
  --paper: #0a0a0a;
  --side: #000;
  --ink: #ededed;
  --muted: #a3a3a3;
  --line: #262626;
  --green: #ededed;
  --green-soft: #171717;
  --theme-text: #ededed;
  --theme-muted-text: #a3a3a3;
  --theme-paper: #0a0a0a;
  --theme-soft-surface: #171717;
  --theme-cool-surface: #111;
  --theme-border: #404040;
  --theme-selected: #1a1a1a;
  --theme-selected-border: #a3a3a3;
  --theme-diagram-arrow: #a3a3a3;
  --theme-warning-text: #d4d4d4;
  --theme-primary-text: #000;
  --seq-request: #dedede;
  --seq-return: #b3b3b3;
  --seq-lifeline: #666;
  --seq-role-border: #555;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
}
h1,
h2,
h3,
p {
  margin: 0;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
  border-radius: 0;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button:focus-visible,
a:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 3px;
}
button svg {
  pointer-events: none;
}
svg {
  display: block;
}
.hidden,
[hidden] {
  display: none !important;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.small {
  font-size: 11px;
}
.muted {
  color: var(--muted);
}
.icon {
  flex-shrink: 0;
}
.app {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--side);
  border-right: 1px solid var(--line);
  min-width: 0;
}
.brand {
  display: grid;
  gap: 5px;
  padding: 0 10px 18px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand-name {
  font-size: 16px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.brand-subtitle {
  font-size: 11px;
  color: var(--muted);
}
.sidebar-top {
  display: grid;
  gap: 10px;
  flex-shrink: 0;
}
.overview-nav {
  padding: 8px 10px;
  text-align: left;
  font-size: 13px;
}
.overview-nav.active,
.overview-nav:hover {
  background: var(--theme-selected);
}
.view-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line);
  padding: 3px;
}
.view-tab {
  padding: 7px 3px;
  font-size: 12px;
  color: var(--muted);
}
.view-tab.active {
  background: var(--theme-selected);
  color: var(--ink);
}
.sidebar-directory {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-directory > nav {
  flex: 1;
  min-height: 0;
  overflow: auto;
  scrollbar-width: none;
}
.sidebar-directory > nav::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
.nav-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  flex-shrink: 0;
}
.nav-label {
  font-size: 10px;
  color: var(--muted);
  padding: 0 8px;
}
.tree-actions {
  display: flex;
  gap: 6px;
}
.tree-actions button {
  padding: 3px 0;
  font-size: 9px;
  white-space: nowrap;
  color: var(--muted);
}
.tree-actions button:hover:not(:disabled) {
  color: var(--ink);
}
.nav-items {
  display: grid;
  gap: 3px;
}
.nav-item {
  width: 100%;
  text-align: left;
  padding: 9px 8px;
  display: flex;
  gap: 6px;
  font-size: 12px;
}
.nav-item:hover,
.nav-item.active {
  background: var(--theme-selected);
}
.nav-end {
  margin-left: auto;
}
.nav-feature-status {
  font-size: 9px;
  color: var(--muted);
  flex-shrink: 0;
}
.new-feature-nav {
  border-top: 1px solid var(--line);
  margin-top: 10px;
  padding-top: 12px;
}
.feature-tree {
  min-width: 0;
}
.feature-group > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
}
.feature-group > summary::-webkit-details-marker {
  display: none;
}
.feature-group > summary small {
  margin-left: auto;
  font-size: 9px;
}
.group-chevron {
  display: inline-block;
  width: 8px;
  font-size: 16px;
  line-height: 1;
}
.feature-group[open] > summary > .group-chevron {
  transform: rotate(90deg);
}
.feature-group-children {
  margin-left: 10px;
  padding-left: 5px;
  border-left: 1px solid var(--line);
}
.feature-leaf > span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.workspace {
  min-width: 0;
}
.topbar {
  height: 76px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 27px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.breadcrumb strong {
  font-weight: 500;
  color: var(--ink);
  flex-shrink: 0;
}
#breadcrumb-section {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-actions {
  flex-shrink: 0;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  padding: 7px 12px;
  font-size: 12px;
  background: var(--paper);
}
.button:hover {
  border-color: var(--theme-border);
  background: var(--theme-soft-surface);
}
.button.primary {
  background: var(--ink);
  color: var(--theme-primary-text);
  border-color: var(--ink);
}
.button.text {
  padding: 0;
  border: 0;
  background: none;
}
.theme-toggle {
  width: 34px;
  height: 34px;
  padding: 0;
}
.page {
  max-width: 1380px;
  margin: auto;
  padding: 24px 27px;
  min-width: 0;
}
.page-heading {
  margin-bottom: 22px;
}
.page-heading h1 {
  font-size: 24px;
  font-weight: 600;
}
.journey-canvas {
  border: 1px solid var(--line);
  padding: 18px 20px 16px;
}
.journey-head {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.journey-head h2 {
  font-size: 15px;
  font-weight: 600;
}
.feature-name-editor {
  flex-wrap: wrap;
}
.feature-name-field {
  width: 180px;
  max-width: 100%;
  padding: 3px 5px;
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  background: none;
  font-weight: 600;
  line-height: 1.6;
}
.feature-name-field:focus {
  outline: 1px solid var(--muted);
}
.feature-name-editor > .button {
  font-size: 10px;
  padding: 4px 7px;
}
.diagram-gallery-nav {
  display: flex;
  border: 1px solid var(--line);
  padding: 3px;
  gap: 3px;
  margin-bottom: 12px;
}
.diagram-tab {
  flex: 1;
  white-space: nowrap;
  padding: 8px;
  font-size: 11px;
  color: var(--muted);
}
.diagram-tab.active {
  background: var(--theme-selected);
  color: var(--ink);
}
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  background: var(--theme-soft-surface);
  white-space: nowrap;
}
.document-summary {
  padding: 12px 0 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.document-editor-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.document-editor-heading label {
  font-size: 12px;
  font-weight: 600;
}
.document-status {
  font-size: 10px;
  color: var(--muted);
}
.document-group-field {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.document-group-field > label {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.document-group-field input,
#new-feature-group {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  padding: 6px 8px;
  background: var(--paper);
  font-size: 11px;
}
.document-summary textarea,
.feature-annotations textarea {
  display: block;
  width: 100%;
  min-height: 125px;
  border: 1px solid var(--line);
  padding: 10px 12px;
  background: var(--paper);
  font-size: 13px;
  line-height: 1.95;
  resize: vertical;
}
.feature-annotations {
  margin: 18px 0 22px;
  padding: 16px;
  border: 1px solid var(--line);
  background: var(--theme-soft-surface);
}
.feature-annotations p,
.document-access p {
  margin: 8px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.feature-annotations textarea {
  min-height: 90px;
}
.annotation-help {
  font-size: 11px !important;
}
.annotation-history {
  margin-top: 14px;
  font-size: 12px;
}
.annotation-record-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.annotation-history article {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.annotation-history p {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.annotation-history small {
  display: block;
  color: var(--muted);
  margin-bottom: 6px;
}
.document-access {
  margin: 18px 28px 0;
  padding: 14px 16px;
  border: 1px solid var(--line);
  font-size: 12px;
}
.document-access[hidden] {
  display: none;
}
.document-access summary {
  cursor: pointer;
}
.document-access code {
  display: block;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.document-editor-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.document-editor-actions > span {
  margin-right: auto;
  font-size: 10px;
  color: var(--muted);
}
.document-editor-actions .button {
  font-size: 11px;
  padding: 5px 9px;
}
.document-sync-note,
.document-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 14px;
}
.document-sync-note {
  border-left: 2px solid var(--line);
  padding: 6px 10px;
}
.flow-version-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.flow-version-bar h3 {
  font-size: 12px;
}
.flow-version-hint {
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
}
.empty-state {
  font-size: 12px;
  color: var(--muted);
  padding: 22px 12px;
  border: 1px solid var(--line);
}
.empty-state h3 {
  font-size: 13px;
  margin-bottom: 5px;
}
.graph-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  background: var(--bg);
}
.flow-graph {
  position: relative;
  margin: auto;
}
.graph-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.graph-edges text {
  font-size: 10px;
  fill: var(--muted);
}
.graph-node {
  position: absolute;
  top: 59px;
  width: 170px;
  height: 104px;
  border: 1px solid var(--theme-border);
  background: var(--paper);
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
}
.graph-node:hover,
.graph-node.selected {
  border-color: var(--ink);
  background: var(--theme-selected);
}
.graph-node-head {
  display: flex;
  gap: 7px;
  font-size: 9px;
  color: var(--muted);
}
.graph-node-head .mono {
  margin-right: auto;
}
.graph-node strong {
  font-size: 13px;
}
.graph-node-copy {
  font-size: 10px;
  color: var(--muted);
}
.graph-node-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: var(--muted);
  margin-top: auto;
}
.graph-node-meta svg {
  margin-left: auto;
}
.graph-failure {
  position: absolute;
  width: 275px;
  border: 1px solid var(--line);
  padding: 8px 10px;
  font-size: 10px;
  line-height: 1.6;
  background: var(--paper);
  color: var(--muted);
}
.graph-warning-label {
  fill: var(--muted);
}
.map-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  margin-bottom: 12px;
}
.map-title > span {
  font-size: 10px;
  color: var(--muted);
}
.map-canvas {
  width: 920px;
}
.map-node {
  position: absolute;
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 5px;
  border: 1px solid var(--theme-border);
  padding: 10px 12px;
  background: var(--paper);
}
.map-node:hover {
  background: var(--theme-selected);
  border-color: var(--ink);
}
.map-node-type {
  font-size: 9px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
.map-node strong {
  font-size: 13px;
}
.map-subtitle,
.map-fields {
  font-size: 10px;
  line-height: 1.7;
  color: var(--muted);
}
.map-fields {
  display: grid;
  gap: 2px;
  border-top: 1px solid var(--line);
  padding-top: 7px;
}
.diagram-footnote {
  font-size: 10px;
  color: var(--muted);
  margin-top: 10px;
}
.sequence-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
}
.sequence-title {
  font-size: 12px;
  font-weight: 600;
}
.sequence-scenario {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
}
.sequence-scenario select {
  border: 1px solid var(--line);
  padding: 5px 9px;
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
}
.sequence-step-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.sequence-step-button {
  display: flex;
  gap: 6px;
  border: 1px solid var(--line);
  padding: 6px 8px;
  font-size: 10px;
}
.sequence-step-button.active {
  background: var(--theme-selected);
}
.sequence-scroll {
  overflow-x: auto;
}
.sequence-svg {
  width: 100%;
  min-width: 540px;
  max-width: 880px;
  margin: auto;
}
.seq-role {
  font-size: 13px;
  font-weight: 600;
  fill: var(--ink);
}
.seq-message {
  font-size: 12px;
  fill: var(--ink);
}
.seq-order,
.seq-caption {
  font-size: 9px;
  fill: var(--muted);
}
.seq-response {
  fill: var(--muted);
}
.seq-lifeline {
  stroke: var(--seq-lifeline);
  stroke-width: 1.3;
  vector-effect: non-scaling-stroke;
}
.seq-role-box {
  stroke: var(--seq-role-border);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.sequence-legend {
  display: flex;
  gap: 16px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.sequence-legend > span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sequence-line {
  width: 22px;
  border-top: 2px solid var(--seq-request);
}
.sequence-line.return {
  border-top: 2px dashed var(--seq-return);
}
.modal {
  padding: 0;
  border: 1px solid var(--theme-border);
  width: 740px;
  max-width: calc(100vw - 36px);
  background: var(--paper);
  color: var(--ink);
}
.modal::backdrop {
  background: #0008;
  backdrop-filter: blur(2px);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.modal-title {
  font-size: 18px;
  font-weight: 600;
}
.icon-button {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
}
.passport-context {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}
.modal-body {
  padding: 14px 20px;
  max-height: calc(100vh - 150px);
  overflow: auto;
}
.passport-description {
  font-size: 12px;
  line-height: 1.9;
  margin-bottom: 14px;
}
.passport-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 18px;
}
.passport-section {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.passport-section h3 {
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 9px;
}
.passport-section h3 small {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
}
.passport-section p {
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}
.passport-rules {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 7px;
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}
.passport-dependencies {
  display: grid;
  gap: 6px;
}
.passport-dependencies button {
  padding: 5px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  text-align: left;
}
.passport-dependencies button > svg {
  margin-left: auto;
}
.passport-dependencies small {
  display: block;
  font-size: 10px;
  color: var(--muted);
}
.passport-warning {
  background: var(--theme-soft-surface);
  padding: 10px;
}
.passport-traces {
  margin-top: 16px;
}
.passport-traces ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
  font-size: 11px;
}
.passport-traces li {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 12px;
  color: var(--muted);
}
.passport-check {
  padding: 8px 10px;
  background: var(--theme-soft-surface);
  font-size: 11px;
  color: var(--muted);
  margin-top: 12px;
  line-height: 1.8;
}
.dep-document {
  max-width: 1060px;

    $('step-title').textContent = n.title;
    $('step-context').innerHTML =
      `<span>${esc(n.type || '')}</span><span>${esc([...diagramKinds, ...projectDiagramKinds].find((k) => k.id === kind)?.name || '')}</span><span>${esc(global ? productDocument.product?.name || '整个项目' : f.title)}</span>`;
    $('step-content').innerHTML =
      `<p class="passport-description">${esc(d?.description || n.description || n.subtitle || '')}</p><div class="passport-grid">${rules.length ? `<section class="passport-section"><h3>${d ? '职责与故障影响' : '规则与关系'}</h3><ul class="passport-rules">${rules.map((rule) => `<li>${esc(rule)}</li>`).join('')}</ul></section>` : ''}${links ? `<section class="passport-section"><h3>${n.fields ? '包含的信息' : '关联范围'}</h3><div class="passport-dependencies">${links}</div></section>` : ''}</div>`;
    $('step-modal').showModal();
  }
  function renderBusinessWorkspace(f) {
    const content = activeContent(f),
      text = descriptionEdits.has(f.id) ? descriptionEdits.get(f.id) : content.description,
      r = documentRecord(f);
    const summary = `<section class="document-summary"><div class="document-editor-heading"><label for="feature-description">功能定义</label><span id="feature-status" class="document-status">${featureStatus(f)}</span></div><div class="document-group-field"><label for="document-group-path">所属分组</label><input id="document-group-path" aria-label="所属分组" list="feature-group-options" maxlength="215" value="${esc(groupEdits.has(f.id) ? groupEdits.get(f.id) : groupPathText(f))}" placeholder="模块 / 子模块；留空为未分组">${groupOptions()}</div><textarea id="feature-description" aria-label="功能定义" rows="4" maxlength="5000" placeholder="用自然语言写清楚：谁来使用、每一步做什么、遵守哪些规则、异常时怎么办。">${esc(text || '')}</textarea><div class="document-editor-actions"><span id="document-save-status" role="status"></span><button class="button" id="document-discard" data-document-discard type="button" disabled>撤销修改</button><button class="button" id="document-save" data-document-save type="button" disabled>保存定义</button></div></section>`;
    const stale = r && r.flowRevision !== r.revision;
    const heading = `<div class="flow-version-bar"><h3>业务流程</h3>${f.flow.length ? '<span class="flow-version-hint">点击节点查看详情</span>' : ''}</div>`;
    const flow = f.flow.length
      ? renderClickableFlow(f)
      : `<div class="empty-state"><p>尚未记录业务流程。</p></div>`;
    return (
      summary +
      annotationMarkup(f) +
      (f.notes ? `<p class="document-note">${esc(f.notes)}</p>` : '') +
      heading +
      flow
    );
  }

  function documentFeatures() {
    return features;
  }
  function diagramWidth() {
    const page = $('page'),
      style = getComputedStyle(page);
    return Math.max(
      220,
      Math.floor(
        page.clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight) -
          (state.view === 'feature' ? 42 : 0) -
          2,
      ),
    );
  }
  function renderClickableFlow(f) {
    const width = diagramWidth(),
      count = f.flow.length,
      columns = Math.max(1, Math.min(4, Math.floor((width - 24) / 190))),
      gap = 38,
      nodeWidth = (width - 24 - gap * (columns - 1)) / columns,
      nodeHeight = 126,
      rows = Math.ceil(count / columns),
      height = 24 + rows * nodeHeight + (rows - 1) * 48;
    const positions = f.flow.map((_, i) => {
      const row = Math.floor(i / columns),
        col = row % 2 ? columns - 1 - (i % columns) : i % columns;
      return { x: 12 + col * (nodeWidth + gap), y: 12 + row * (nodeHeight + 48), row };
    });
    const edges = positions
      .slice(1)
      .map((to, i) => {
        const from = positions[i];
        const path =
          from.row === to.row
            ? from.x < to.x
              ? `M${from.x + nodeWidth} ${from.y + nodeHeight / 2} H${to.x - 5}`
              : `M${from.x} ${from.y + nodeHeight / 2} H${to.x + nodeWidth + 5}`
            : `M${from.x + nodeWidth / 2} ${from.y + nodeHeight} V${to.y - 5}`;
        return `<path d="${path}" fill="none" stroke="var(--theme-diagram-arrow)" stroke-width="1.6" marker-end="url(#flow-tip)"/>`;
      })
      .join('');
    const nodes = f.flow
      .map((s, i) => {
        const d = stepDetails(f, i),
          p = positions[i];
        return `<button type="button" class="graph-node ${state.selectedStep === i ? 'selected' : ''}" style="left:${p.x}px;top:${p.y}px;width:${nodeWidth}px;height:${nodeHeight}px" data-step="${i}" aria-label="步骤 ${String(i + 1).padStart(2, '0')}：${esc(s[0])}" aria-haspopup="dialog"><span class="graph-node-head"><span class="mono">${i + 1}</span><span>${esc(d.actor)}</span></span><strong title="${esc(s[0])}">${esc(s[0])}</strong><span class="graph-node-copy">${esc(s[1])}</span><span class="graph-node-meta">${d.rules.length} 条规则 · ${d.dependenciesPending ? '依赖待确认' : d.dependencies.length + ' 项依赖'}</span></button>`;
      })
      .join('');
    const exception = stepDetails(f, state.selectedStep).exception;
    return `<div class="graph-scroll"><div class="flow-graph" style="width:${width}px;height:${height}px"><svg class="graph-edges" viewBox="0 0 ${width} ${height}" aria-hidden="true"><defs><marker id="flow-tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="var(--theme-diagram-arrow)"/></marker></defs>${edges}</svg>${nodes}</div></div>${exception ? `<p class="flow-exception">异常：${esc(exception)}</p>` : ''}`;
  }
  function renderJourney(f) {
    const kind = diagramKinds.find((k) => k.id === state.diagramView) || diagramKinds[0],
      unconfirmed = !f.flow.length;
    const tabs = `<div class="diagram-gallery-nav" role="group" aria-label="图表类型">${diagramKinds.map((k) => `<button class="diagram-tab ${state.diagramView === k.id ? 'active' : ''}" type="button" data-diagram="${k.id}" aria-pressed="${state.diagramView === k.id}">${k.name}</button>`).join('')}</div>`;
    let body =
      kind.id === 'flow'
        ? renderBusinessWorkspace(f)
        : unconfirmed
          ? `<div class="empty-state"><p>尚未记录该图表。</p></div>`
          : kind.id === 'sequence'
            ? renderSharedSequence(f)
            : renderMap(f);
    return `<section class="journey-canvas" aria-label="产品图表"><div class="journey-head feature-name-editor"><h2 aria-label="${esc(f.title)}"><input id="feature-name" aria-label="功能名称" class="feature-name-field" type="text" maxlength="80" value="${esc(titleEdits.has(f.id) ? titleEdits.get(f.id) : f.title)}" title="点击修改功能名称"></h2><button class="button" id="feature-name-save" type="button" data-save-feature-title hidden>保存名称</button><button class="button" id="feature-name-cancel" type="button" data-cancel-feature-title hidden>取消</button><span id="feature-name-status" class="document-status" role="status"></span></div>${tabs}<div id="diagram-body" data-diagram-kind="${kind.id}">${body}</div></section>`;
  }

  function pendingMarkup(feature) {
    const r = documentRecord(feature);
    return r && feature.flow.length && r.flowRevision !== r.revision
      ? `<div class="document-sync-note">定义已修改。以下图表仍对应上一版定义，等待 AI 梳理后同步。</div>`
      : '';
  }
  function renderFeature() {
    const f = featureById(state.feature);
    if (!f) {
      state.view = 'overview';
      render();
      return;
    }
    if (
      !Number.isInteger(state.selectedStep) ||
      state.selectedStep < 0 ||
      state.selectedStep >= f.flow.length
    )
      state.selectedStep = 0;
    $('page').innerHTML =
      `<div class="journey-layout"><article class="journey-document">${pendingMarkup(f)}${renderJourney(f)}</article></div>`;
    updateDescriptionEditor();
    updateTitleEditor();
    updateAnnotationEditor();
  }

  function renderDependencies() {
    const d = depById(state.dependency);
    if (!d) {
      $('page').innerHTML = '<div class="empty-state"><p>尚未记录系统依赖。</p></div>';
      return;
    }
    const related = documentFeatures().filter(
      (f) => (d.relations || []).includes(f.id) || f.dependencies.includes(d.id),
    );
    const rows = related
      .map((f) => {
        const used = f.flow
          .filter((step, i) => stepDetails(f, i).dependencies.includes(d.id))
          .map((step) => step[0]);
        return `<tr><td><button class="dep-text-link" type="button" data-dep-feature="${esc(f.id)}">${esc(f.title)}</button><span class="dep-text-status">${featureStatus(f)}</span></td><td>${used.length ? esc(used.join('、')) : '未记录参与步骤'}</td></tr>`;
      })
      .join('');
    $('page').innerHTML =
      `<article class="dep-document" aria-label="${esc(d.name)}依赖详情"><header class="dep-document-head"><h1>${esc(d.name)}</h1>${d.category ? `<p>${esc(d.category)}</p>` : ''}</header><section><h2>作用与职责</h2>${d.responsibility ? `<p class="dep-responsibility">${esc(d.responsibility)}</p>` : ''}${d.description ? `<p>${esc(d.description)}</p>` : ''}${!d.responsibility && !d.description ? '<p>尚未记录用途。</p>' : ''}</section><section><h2>关联功能 <small>${related.length} 项</small></h2>${rows ? `<table class="dep-function-table" aria-label="依赖关联的功能和步骤"><thead><tr><th scope="col">功能</th><th scope="col">参与步骤</th></tr></thead><tbody>${rows}</tbody></table>` : '<p>尚未确认关联功能。</p>'}</section><section><h2>故障影响</h2><p>${esc(d.failure || '尚未记录故障影响。')}</p></section>${d.openQuestions?.length ? `<section><h2>待确认事项</h2>${d.openQuestions.map((q) => `<p>${esc(q)}</p>`).join('')}</section>` : ''}</article>`;
  }

  function renderOverview() {
    const p = productDocument.product || {},
      tabs = `<div class="diagram-gallery-nav" role="group" aria-label="项目内容">${projectDiagramKinds.map((k) => `<button class="diagram-tab ${state.projectDiagram === k.id ? 'active' : ''}" type="button" data-project-diagram="${k.id}" aria-pressed="${state.projectDiagram === k.id}">${k.name}</button>`).join('')}</div>`;
    const groups = new Map();
    for (const f of documentFeatures()) {
      const name = featureGroups(f).join(' / ') || '未分组';
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(f);
    }
    const summary = `<div class="content-grid"><article><p class="overview-intro">${esc(p.background || '尚未记录产品背景。')}</p><div class="section-heading"><h2>功能</h2></div><div class="overview-list">${[...groups].map(([name, items]) => `<section class="overview-group"><h3>${esc(name)}</h3>${items.map((f) => `<button class="overview-feature" type="button" data-feature="${esc(f.id)}"><div class="overview-feature-title">${esc(f.title)} <span class="document-status">${featureStatus(f)}</span></div><div class="overview-feature-description">${esc(f.overview || f.description)}</div></button>`).join('')}</section>`).join('')}</div></article>${p.actors?.length ? `<aside class="aside"><div class="aside-heading">谁在使用</div>${p.actors.map((actor) => `<div class="person-row">${esc(actor)}</div>`).join('')}</aside>` : ''}</div>`;
    $('page').innerHTML =
      pageHead('', esc(p.name || '产品蓝图')) +
      tabs +
      (state.projectDiagram === 'summary' ? summary : renderMap());
  }
  function render() {
    renderDocumentAccess();
    renderSourceStatus();
    $('page').classList.toggle(
      'dependency-page',
      state.mode === 'dependencies' && state.view === 'dependencies',
    );
    $('page').classList.toggle(
      'journey-page',
      state.view === 'feature' && state.mode === 'business',
    );
    renderNavigation();
    if (state.view === 'new-feature') renderNewFeature();
    else if (state.view === 'overview') renderOverview();
    else if (state.mode === 'dependencies') renderDependencies();
    else renderFeature();
  }
  document.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.hasAttribute('data-tree-open'))
      setAllFeatureGroups(button.dataset.treeOpen === 'true');
    else if (button.hasAttribute('data-source-check')) refreshSourceStatus();
    else if (button.hasAttribute('data-annotation-save')) saveAnnotation();
    else if (button.dataset.annotationEdit) editAnnotation(button.dataset.annotationEdit);
    else if (button.hasAttribute('data-annotation-edit-cancel')) cancelAnnotationEdit();
    else if (button.dataset.annotationRemove) {
      annotationRemoval = {
        featureId: state.feature,
        annotationId: button.dataset.annotationRemove,
      };
      renderFeature();
    } else if (button.dataset.annotationRemoveConfirm)
      removeAnnotation(button.dataset.annotationRemoveConfirm);
    else if (button.hasAttribute('data-annotation-remove-cancel')) {
      annotationRemoval = null;
      renderFeature();
    } else if (button.hasAttribute('data-save-feature-title')) saveFeatureTitle();
    else if (button.hasAttribute('data-cancel-feature-title')) {
      titleEdits.delete(state.feature);
      renderFeature();
    } else if (button.hasAttribute('data-document-save')) saveDescription();
    else if (button.hasAttribute('data-document-discard')) {
      descriptionEdits.delete(state.feature);
      groupEdits.delete(state.feature);
      renderFeature();
    } else if (button.dataset.feature) {
      $('step-modal').close();
      setFeature(button.dataset.feature);
    } else if (button.dataset.depFeature) {
      state.diagramView = 'flow';
      setFeature(button.dataset.depFeature);
    } else if (button.dataset.dependency) {
      $('step-modal').close();
      setDependency(button.dataset.dependency);
    } else if (button.dataset.mode) navigate(button.dataset.mode);
    else if (button.hasAttribute('data-new-feature')) openNewFeature();
    else if (button.hasAttribute('data-cancel-new-feature')) {
      if (!creatingFeature) {
        newFeatureDraft = { id: '', title: '', description: '', groupPathText: '' };
        state.view = features.length ? 'feature' : 'overview';
        render();
      }
    } else if (button.dataset.mapNode) openMapDetails(button.dataset.mapNode);
    else if (button.dataset.projectDiagram) {
      state.projectDiagram = button.dataset.projectDiagram;
      renderOverview();
    } else if (button.dataset.diagram) {
      state.diagramView = button.dataset.diagram;
      renderFeature();
    } else if (button.hasAttribute('data-step')) {
      state.selectedStep = Number(button.dataset.step);
      renderFeature();
      openStepDetails(state.selectedStep);
    } else if (button.dataset.close) $(button.dataset.close).close();
  });
  document.addEventListener('input', (event) => {
    const el = event.target;
    if (el.id === 'feature-annotation') {
      rememberAnnotation(state.feature, el.value);
      updateAnnotationEditor();
    } else if (el.id === 'feature-name') {
      titleEdits.set(state.feature, el.value);
      updateTitleEditor();
    } else if (el.id === 'new-feature-title') {
      newFeatureDraft.title = el.value;
      updateNewFeatureForm();
    } else if (el.id === 'new-feature-group') {
      newFeatureDraft.groupPathText = el.value;
      updateNewFeatureForm();
    } else if (el.id === 'new-feature-definition') {
      newFeatureDraft.description = el.value;
      updateNewFeatureForm();
    } else if (el.id === 'document-group-path') {
      groupEdits.set(state.feature, el.value);
      updateDescriptionEditor();
    } else if (el.id === 'feature-description') {
      descriptionEdits.set(state.feature, el.value);
      updateDescriptionEditor();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.target.id === 'feature-name') {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (!$('feature-name-save').disabled) saveFeatureTitle();
      } else if (event.key === 'Escape') {
        titleEdits.delete(state.feature);
        renderFeature();
      }
    }
  });
  document.addEventListener('change', (event) => {
    if (event.target.id === 'shared-sequence-case') {
      state.sequenceCase = event.target.value;
      renderFeature();
    }
  });
  document.addEventListener(
    'toggle',
    (event) => {
      if (event.target.isConnected && event.target.classList?.contains('feature-group')) {
        expandedGroups.set(event.target.dataset.featureGroup, event.target.open);
        updateTreeControls();
      }
    },
    true,
  );
  document.addEventListener('submit', (event) => {
    if (event.target.id === 'new-feature-form') {
      event.preventDefault();
      createDocumentFeature();
    }
  });
  $('overview-button').addEventListener('click', () => {
    state.mode = 'business';
    state.view = 'overview';
    render();
  });
  $('step-modal').addEventListener('click', (e) => {
    if (e.target === $('step-modal')) {
      const box = e.target.getBoundingClientRect();
      if (
        e.clientX < box.left ||
        e.clientX > box.right ||
        e.clientY < box.top ||
        e.clientY > box.bottom
      )
        e.target.close();
    }
  });
  document
    .querySelectorAll('.icon-button[data-close]')
    .forEach((button) => (button.innerHTML = icon('close', 17)));
  function renderThemeToggle() {
    const dark = document.documentElement.dataset.theme === 'dark',
      button = $('theme-toggle');
    button.innerHTML = icon(dark ? 'sun' : 'moon', 16);
    button.setAttribute('aria-label', dark ? '切换为浅色主题' : '切换为深色主题');
    button.title = (dark ? '当前为深色' : '当前为浅色') + '，点击切换';
  }
  $('theme-toggle').addEventListener('click', () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem('product-workbench-theme', theme);
    } catch {}
    renderThemeToggle();
  });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.view === 'feature') renderFeature();
      else if (state.view === 'overview' && state.projectDiagram !== 'summary') renderOverview();
    }, 100);
  });
  renderThemeToggle();
  applyProductDocument(embeddedDocument);
  render();
  loadProductDocument();
})();

    </script>
  </body>
</html>
